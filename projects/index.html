<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="邱琪涵的产品项目案例：四屏呈现业务背景、证据判断、方案落地与结果贡献。" />
    <meta name="theme-color" content="#f4efe6" />
    <title>快影云空间升级 | 邱琪涵产品作品集</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4efe6;
        --paper-soft: #ece5da;
        --surface: #faf7f0;
        --ink: #24211d;
        --muted: #6f685e;
        --accent: #e8681a;
        --accent-soft: #f3c39f;
        --control: #806651;
        --control-deep: #6f5643;
        --control-soft: #e8ddd3;
        --control-line: #c8b5a5;
        --control-track: #ddd2c7;
        --control-on: #fffaf4;
        --line: rgba(36, 33, 29, 0.16);
        --line-strong: rgba(36, 33, 29, 0.3);
        --header-h: 78px;
        --gutter: clamp(24px, 4.6vw, 72px);
        --shell: 1450px;
        --radius: 18px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --sans: "Avenir Next", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      body[data-project="cloud"] {
        --paper: #f4efe6;
        --paper-soft: #ece5da;
        --surface: #faf7f0;
        --accent: #e8681a;
        --accent-soft: #f3c39f;
        --control: #806651;
        --control-deep: #6f5643;
        --control-soft: #e8ddd3;
        --control-line: #c8b5a5;
        --control-track: #ddd2c7;
      }
      body[data-project="kwai"] {
        --paper: #e7f0eb;
        --paper-soft: #d8e6df;
        --surface: #f5faf7;
        --accent: #236b52;
        --accent-soft: #acd4c1;
        --control: #3f705d;
        --control-deep: #285142;
        --control-soft: #d1e4da;
        --control-line: #a9c6b7;
        --control-track: #c9dbd2;
      }
      body[data-project="credits"] {
        --paper: #eef3f8;
        --paper-soft: #dfe9f2;
        --surface: #f8fbfd;
        --accent: #196087;
        --accent-soft: #b9dcec;
        --control: #356d8a;
        --control-deep: #1d4d68;
        --control-soft: #d8e7f0;
        --control-line: #afc9d8;
        --control-track: #cedde6;
      }
      body[data-project="crm"] {
        --paper: #f7e5eb;
        --paper-soft: #edd3dc;
        --surface: #fff7f9;
        --accent: #7a304b;
        --accent-soft: #e5b5c5;
        --control: #845066;
        --control-deep: #613346;
        --control-soft: #efd9e1;
        --control-line: #d7b2bf;
        --control-track: #e4cbd4;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      html { background: var(--paper); }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.58;
        overflow: hidden;
        overscroll-behavior: none;
      }
      button, a { color: inherit; font: inherit; -webkit-tap-highlight-color: transparent; }
      button { cursor: pointer; }
      a { text-decoration: none; }
      img { display: block; max-width: 100%; }
      h1, h2, h3, h4, p, figure, blockquote { margin: 0; }
      h1, h2, h3, h4 { text-wrap: balance; }
      p { text-wrap: pretty; }
      small { font-size: 15px; }
      [hidden] { display: none !important; }
      ::selection { color: var(--surface); background: var(--accent); }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

      .skip-link {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 100;
        padding: 10px 14px;
        color: var(--surface);
        background: var(--ink);
        transform: translateY(-180%);
      }
      .skip-link:focus { transform: none; }

      .case-header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 50;
        height: var(--header-h);
        display: grid;
        grid-template-columns: minmax(170px, 1fr) auto minmax(170px, 1fr);
        align-items: center;
        gap: 20px;
        padding: 0 var(--gutter);
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--paper) 93%, transparent);
        backdrop-filter: blur(18px);
      }
      .brand-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        justify-self: start;
        min-height: 44px;
        font-size: 15px;
        font-weight: 750;
        white-space: nowrap;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        color: var(--control-on);
        background: var(--control-deep);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.04em;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 -3px 0 var(--accent);
      }
      .state-nav { display: flex; align-items: center; justify-content: center; gap: 4px; }
      .state-nav button {
        min-height: 44px;
        padding: 10px 14px;
        color: var(--muted);
        border: 0;
        border-radius: 999px;
        background: transparent;
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
        transition: color 180ms, background 180ms, transform 180ms;
      }
      .state-nav button:hover { color: var(--control-deep); background: color-mix(in srgb, var(--control-soft) 72%, var(--surface)); }
      .state-nav button[aria-selected="true"] {
        color: var(--control-on);
        background: var(--control);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 5px 16px rgba(111, 86, 67, 0.15);
      }
      .state-nav button:active { transform: translateY(1px); }
      .header-status {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 18px;
        justify-self: end;
        color: var(--muted);
        font-size: 15px;
        white-space: nowrap;
      }
      .state-count { color: var(--ink); font-weight: 750; font-variant-numeric: tabular-nums; }
      .header-progress { position: absolute; right: 0; bottom: -1px; left: 0; height: 3px; }
      .header-progress span {
        display: block;
        width: 25%;
        height: 100%;
        background: var(--accent);
        transform: translateX(calc(var(--active-index, 0) * 100%));
        transition: transform 620ms var(--ease);
      }

      .project-viewport { width: 100%; height: 100dvh; overflow: hidden; }
      .project-deck {
        width: 100%;
        height: 400dvh;
        transform: translate3d(0, calc(var(--active-index, 0) * -100dvh), 0);
        transition: transform 720ms var(--ease);
        will-change: transform;
      }
      .has-gsap .project-deck { transform: none; transition: none; }
      .case-screen {
        position: relative;
        width: 100%;
        height: 100dvh;
        padding: calc(var(--header-h) + clamp(18px, 2.6vh, 28px)) var(--gutter) clamp(16px, 2.5vh, 26px);
        overflow: hidden;
      }
      .screen-shell { width: min(100%, var(--shell)); height: 100%; margin-inline: auto; }
      .screen-title {
        font-size: clamp(34px, 3.2vw, 50px);
        font-weight: 650;
        letter-spacing: -0.035em;
        line-height: 1.12;
      }
      .section-copy { max-width: 62ch; color: var(--muted); font-size: 16px; line-height: 1.68; }
      .screen-kicker { color: var(--accent); font-size: 15px; font-weight: 800; letter-spacing: 0.06em; }
      .image-button {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: zoom-in;
      }
      .image-button:focus-visible { outline: 0; box-shadow: inset 0 0 0 3px var(--accent); }
      .image-button img { transition: transform 360ms var(--ease); }
      .image-button:hover img { transform: scale(1.008); }

      /* 概览 */
      .screen-overview { background: var(--paper); }
      .overview-layout { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: clamp(14px, 2vh, 22px); }
      .overview-main {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(310px, 0.7fr) minmax(560px, 1.3fr);
        align-items: center;
        gap: clamp(34px, 5vw, 76px);
      }
      .hero-copy { max-width: 560px; }
      .hero-copy h1 {
        max-width: 9em;
        margin-top: 12px;
        font-size: clamp(46px, 4.6vw, 70px);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 1.04;
      }
      .hero-thesis { max-width: 31em; margin-top: 20px; color: var(--muted); font-size: 17px; line-height: 1.68; }
      .hero-thesis strong { color: var(--ink); }
      .hero-decision {
        max-width: 31em;
        margin-top: 22px;
        padding-left: 16px;
        border-left: 4px solid var(--accent);
        font-size: 17px;
        font-weight: 700;
        line-height: 1.58;
      }
      .device-stage, .hero-stage {
        position: relative;
        min-width: 0;
        height: 100%;
        min-height: 360px;
        overflow: hidden;
      }
      .device-stage::before, .hero-stage::before {
        position: absolute;
        top: 7%;
        right: 6%;
        width: min(39vw, 520px);
        aspect-ratio: 1.45;
        border-radius: 50%;
        background: color-mix(in srgb, var(--accent-soft) 62%, var(--paper));
        content: "";
        transform: rotate(-8deg);
      }
      .device-stage::after, .hero-stage::after {
        position: absolute;
        right: 0;
        bottom: 5%;
        left: 9%;
        height: 1px;
        background: var(--line);
        content: "";
      }
      .device-stage img {
        position: absolute;
        z-index: 1;
        bottom: 5%;
        width: auto;
        height: 88%;
        object-fit: contain;
        border: 1px solid rgba(36, 33, 29, 0.1);
        border-radius: 24px;
        filter: drop-shadow(0 26px 24px rgba(36, 33, 29, 0.2));
      }
      .device-stage img:first-child { left: 19%; transform: translateY(-2%) rotate(-2deg); }
      .device-stage img:last-child { right: 12%; height: 82%; transform: translateY(2%) rotate(2deg); }
      .map-paper {
        position: absolute;
        z-index: 1;
        inset: 8% 6% 9% 12%;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 26px 44px rgba(36, 33, 29, 0.16);
        transform: rotate(-1.5deg);
      }
      .map-paper img { width: 100%; height: 100%; object-fit: contain; }
      .system-hero-canvas, .crm-hero-canvas {
        position: absolute;
        z-index: 1;
        inset: 10% 7% 11% 11%;
        display: grid;
        align-content: center;
        gap: 15px;
        padding: clamp(18px, 2vw, 30px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        box-shadow: 0 26px 44px rgba(36, 33, 29, 0.15);
        transform: rotate(-1deg);
      }
      .system-flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: stretch; gap: 8px; }
      .system-node {
        min-width: 0;
        display: grid;
        align-content: center;
        gap: 7px;
        min-height: 150px;
        padding: 14px 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
        text-align: center;
      }
      .system-node strong { font-size: 17px; line-height: 1.25; }
      .system-node span { color: var(--muted); font-size: 15px; line-height: 1.4; }
      .system-node.is-focus { color: var(--control-on); border-color: var(--control); background: var(--control); }
      .system-node.is-focus span { color: rgba(255, 250, 244, 0.8); }
      .system-caption, .crm-constraint { color: var(--muted); font-size: 15px; text-align: center; }
      .crm-hero-canvas { grid-template-rows: repeat(2, minmax(0, 1fr)) auto; }
      .crm-lane {
        display: grid;
        grid-template-columns: 130px minmax(0, 1fr) 140px;
        align-items: center;
        gap: 15px;
        padding: 16px;
        border-top: 1px solid var(--line-strong);
      }
      .crm-lane:first-child { border-top: 0; }
      .crm-lane > strong { font-size: 19px; }
      .crm-path { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
      .crm-path i { flex: 1; height: 1px; background: var(--control-line); }
      .crm-result { text-align: right; }
      .crm-result b { display: block; color: var(--accent); font-size: clamp(28px, 3vw, 44px); line-height: 1; }
      .crm-result span { color: var(--muted); font-size: 15px; }
      .overview-metrics {
        display: grid;
        grid-template-columns: 1.35fr 0.82fr 0.68fr;
        border-top: 1px solid var(--line-strong);
        border-bottom: 1px solid var(--line);
      }
      .metric-item {
        min-height: 104px;
        display: grid;
        align-content: space-between;
        gap: 10px;
        padding: clamp(15px, 1.8vw, 23px);
        border-left: 1px solid var(--line);
      }
      .metric-item:first-child { border-left: 0; }
      .metric-item span { color: var(--muted); font-size: 15px; font-weight: 700; }
      .metric-item strong { font-size: clamp(25px, 2.35vw, 36px); font-weight: 750; letter-spacing: -0.04em; line-height: 1.08; }
      .metric-item:first-child strong { color: var(--accent); }

      /* 证据与判断 */
      .screen-evidence { background: var(--paper-soft); }
      .evidence-layout {
        display: grid;
        grid-template-columns: minmax(360px, 0.72fr) minmax(520px, 1.28fr);
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas: "head map" "insights map";
        gap: 16px clamp(34px, 5vw, 76px);
      }
      .evidence-head { grid-area: head; align-self: start; }
      .evidence-head .section-copy { margin-top: 12px; }
      .evidence-insights {
        grid-area: insights;
        min-height: 0;
        display: grid;
        grid-template-rows: auto auto auto;
        align-content: space-between;
        gap: 14px;
      }
      .diagnosis-stack, .evidence-stat-stack { display: grid; gap: 13px; }
      .breakpoint-stat { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 1px solid var(--line-strong); }
      .breakpoint-stat span { max-width: 13em; color: var(--muted); font-size: 15px; font-weight: 700; }
      .breakpoint-stat strong { color: var(--accent); font-size: clamp(38px, 4vw, 58px); font-weight: 750; letter-spacing: -0.055em; line-height: 1; }
      .funnel { display: grid; gap: 9px; }
      .funnel-row { display: grid; grid-template-columns: 108px minmax(0, 1fr) 60px; align-items: center; gap: 12px; }
      .funnel-row span, .funnel-row strong { font-size: 15px; }
      .funnel-row strong { text-align: right; font-variant-numeric: tabular-nums; }
      .funnel-track { height: 8px; overflow: hidden; border-radius: 999px; background: var(--control-track); }
      .funnel-track i {
        display: block;
        width: var(--w);
        min-width: 8px;
        height: 100%;
        border-radius: inherit;
        background: var(--control);
        transform-origin: left center;
        will-change: transform;
      }
      .funnel-row.is-break .funnel-track i { background: var(--accent); }
      .voice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .voice-grid blockquote { padding-top: 12px; border-top: 1px solid var(--line); }
      .voice-grid strong, .insight-row strong { color: var(--accent); font-size: 15px; }
      .voice-grid p, .insight-row p { margin-top: 5px; font-size: 15px; line-height: 1.5; }
      .insight-list { display: grid; gap: 8px; }
      .insight-row { padding-top: 8px; border-top: 1px solid var(--line); }
      .judgment-box { padding: 13px 0 0 15px; border-top: 1px solid var(--line); border-left: 4px solid var(--accent); }
      .judgment-box h3 { font-size: 19px; font-weight: 750; line-height: 1.36; }
      .judgment-flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 10px; }
      .judgment-flow small { display: block; color: var(--muted); font-weight: 700; }
      .judgment-flow strong { display: block; margin-top: 3px; font-size: 15px; line-height: 1.38; }
      .research-figure, .evidence-visual {
        grid-area: map;
        min-height: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 9px;
      }
      .research-frame, .evidence-board {
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        overflow: hidden;
      }
      .research-frame img { width: 100%; height: 100%; object-fit: contain; }
      .research-figure figcaption, .evidence-caption { display: flex; justify-content: space-between; gap: 18px; color: var(--muted); font-size: 15px; line-height: 1.45; }
      .research-figure figcaption span:last-child { color: var(--ink); font-weight: 700; white-space: nowrap; }
      .ecosystem-board { display: grid; align-content: center; gap: 20px; padding: clamp(22px, 3vw, 44px); }
      .ecosystem-path { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .ecosystem-node {
        min-width: 0;
        min-height: 150px;
        display: grid;
        align-content: center;
        gap: 8px;
        padding: 18px 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
      }
      .ecosystem-node strong { font-size: 18px; }
      .ecosystem-node span { color: var(--muted); font-size: 15px; line-height: 1.45; }
      .ecosystem-node.is-focus { color: var(--control-on); border-color: var(--control); background: var(--control); }
      .ecosystem-node.is-focus span { color: rgba(255, 250, 244, 0.8); }
      .board-note { max-width: 48em; color: var(--muted); font-size: 15px; line-height: 1.5; }
      .research-products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .research-product { min-height: 150px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
      .research-product strong { font-size: clamp(22px, 2.2vw, 32px); }
      .research-product p { margin-top: 8px; color: var(--muted); font-size: 15px; }
      .mechanism-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line-strong); }
      .mechanism-strip span { padding: 12px 10px; border-left: 1px solid var(--line); color: var(--muted); font-size: 15px; text-align: center; }
      .mechanism-strip span:first-child { border-left: 0; }
      .model-board { display: grid; grid-template-columns: 1fr auto 1.3fr auto 1.1fr; align-items: stretch; gap: 12px; padding: clamp(22px, 3vw, 44px); }
      .model-group, .model-output {
        display: grid;
        align-content: center;
        gap: 12px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
      }
      .model-group h3, .model-output h3 { font-size: 20px; }
      .signal-list { display: flex; flex-wrap: wrap; gap: 7px; }
      .signal-list span { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 15px; }
      .model-output { color: var(--control-on); border-color: var(--control); background: var(--control); }
      .model-output p { color: rgba(255, 250, 244, 0.82); font-size: 15px; line-height: 1.45; }
      .model-operator { align-self: center; color: var(--accent); font-size: 30px; font-weight: 750; }

      /* 方案 */
      .screen-solution { background: var(--paper); }
      .solution-layout { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: clamp(14px, 2vh, 22px); }
      .solution-head { display: grid; grid-template-columns: minmax(350px, 1fr) auto; align-items: end; gap: 28px; }
      .solution-head .section-copy { margin-top: 10px; }
      .phase-map { display: grid; grid-template-columns: repeat(2, minmax(190px, 1fr)); gap: 8px; }
      .phase-map button {
        min-height: 74px;
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto;
        gap: 2px 11px;
        padding: 12px 14px;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        text-align: left;
        transition: color 220ms, background 220ms, border-color 220ms, transform 180ms;
      }
      .phase-map button:hover:not([aria-pressed="true"]) { color: var(--control-deep); border-color: var(--control-line); background: color-mix(in srgb, var(--control-soft) 48%, var(--surface)); }
      .phase-map button:active { transform: translateY(1px); }
      .phase-map button[aria-pressed="true"] { color: var(--control-on); border-color: var(--control); background: var(--control); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 8px 20px rgba(111, 86, 67, 0.13); }
      .phase-number { grid-row: 1 / 3; align-self: center; color: var(--accent); font-size: 15px; font-weight: 800; }
      .phase-map strong { font-size: 17px; line-height: 1.2; }
      .phase-map small { color: var(--muted); line-height: 1.25; }
      .phase-map button[aria-pressed="true"] .phase-number { color: #fff0e3; }
      .phase-map button[aria-pressed="true"] small { color: rgba(255, 250, 244, 0.78); }
      .solution-workbench { min-height: 0; display: grid; grid-template-columns: minmax(600px, 1.46fr) minmax(300px, 0.54fr); gap: clamp(20px, 3vw, 40px); }
      .phase-board {
        min-height: 0;
        padding: clamp(12px, 1.6vw, 20px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--paper-soft);
        overflow: hidden;
      }
      .mode-panel { width: 100%; height: 100%; min-height: 0; }
      .phase-panel { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
      .phase-frame { min-height: 0; display: grid; place-items: center; overflow: hidden; }
      .phase-frame img { width: 100%; height: 100%; object-fit: contain; }
      .phase-caption { display: grid; grid-template-columns: minmax(170px, 0.48fr) minmax(0, 1.52fr); gap: 20px; padding-top: 12px; border-top: 1px solid var(--line); }
      .phase-caption strong { font-size: 17px; line-height: 1.42; }
      .phase-caption p { color: var(--muted); font-size: 15px; line-height: 1.5; }
      .detail-column { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
      .detail-column h3 { font-size: 18px; font-weight: 750; }
      .detail-grid { min-height: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .detail-grid:not([hidden]) { display: grid; }
      .detail-item { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 7px; padding-top: 10px; border-top: 1px solid var(--line-strong); }
      .detail-visual { min-height: 0; display: grid; place-items: center; overflow: hidden; }
      .detail-visual img { width: 100%; height: 100%; object-fit: contain; }
      .detail-item strong { font-size: 15px; line-height: 1.35; }
      .detail-item p { color: var(--muted); font-size: 15px; line-height: 1.43; }
      .text-detail { grid-template-rows: auto minmax(0, 1fr); align-content: start; gap: 10px; padding: 13px 0; }
      .text-detail strong { color: var(--accent); font-size: 17px; }
      .text-detail p { color: var(--ink); }
      .solution-canvas { min-height: 0; height: 100%; display: grid; align-content: center; gap: 16px; padding: clamp(18px, 2.4vw, 34px); background: var(--surface); }
      .solution-canvas .ecosystem-path { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .locale-summary { display: grid; grid-template-columns: 0.45fr 1.55fr; align-items: end; gap: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--line-strong); }
      .locale-summary strong { color: var(--accent); font-size: clamp(44px, 5vw, 72px); letter-spacing: -0.06em; line-height: 1; }
      .locale-summary p { color: var(--muted); font-size: 15px; line-height: 1.5; }
      .locale-matrix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 22px; }
      .locale-row { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
      .locale-row strong, .locale-row span { font-size: 15px; }
      .locale-row span { color: var(--muted); text-align: right; }
      .credit-controls { display: flex; flex-wrap: wrap; gap: 7px; }
      .credit-controls button { min-height: 42px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 15px; font-weight: 700; }
      .credit-controls button[aria-pressed="true"] { color: var(--control-on); border-color: var(--control); background: var(--control); }
      .credit-machine { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
      .credit-node { min-width: 0; min-height: 130px; display: grid; align-content: center; gap: 7px; padding: 14px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
      .credit-node strong { font-size: 16px; }
      .credit-node span { color: var(--muted); font-size: 15px; line-height: 1.38; }
      .credit-node.is-active { color: var(--control-on); border-color: var(--control); background: var(--control); }
      .credit-node.is-active span { color: rgba(255, 250, 244, 0.8); }
      .state-explanation { padding-left: 13px; border-left: 4px solid var(--accent); font-size: 15px; line-height: 1.48; }
      .exception-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .exception-item { min-height: 155px; display: grid; align-content: center; gap: 8px; padding: 18px; border-top: 3px solid var(--accent); background: var(--paper); }
      .exception-item strong { font-size: 18px; }
      .exception-item p { color: var(--muted); font-size: 15px; }
      .sms-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .sms-level { min-height: 220px; display: grid; grid-template-rows: auto auto minmax(0, 1fr); align-content: start; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
      .sms-level h3 { font-size: clamp(20px, 2vw, 28px); }
      .sms-level > p { color: var(--muted); font-size: 15px; }
      .sms-action { align-self: end; padding-top: 12px; border-top: 1px solid var(--line); }
      .sms-action strong { display: block; color: var(--accent); font-size: 16px; }
      .sms-action span { display: block; margin-top: 4px; font-size: 15px; line-height: 1.4; }

      /* 结果与贡献 */
      .screen-result { background: var(--paper-soft); }
      .result-layout { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: clamp(14px, 2vh, 22px); }
      .result-head { display: grid; grid-template-columns: minmax(360px, 0.82fr) minmax(420px, 1.18fr); align-items: end; gap: clamp(34px, 6vw, 90px); }
      .result-head .section-copy { max-width: 48em; }
      .result-main { min-height: 0; display: grid; grid-template-columns: minmax(360px, 0.76fr) minmax(560px, 1.24fr); gap: clamp(38px, 5vw, 72px); }
      .outcome-list { display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line-strong); }
      .outcome-line { display: grid; align-content: center; gap: 7px; padding: 15px 0; border-bottom: 1px solid var(--line); }
      .outcome-line h3 { color: var(--muted); font-size: 15px; font-weight: 750; }
      .outcome-value { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
      .outcome-value small { color: var(--muted); font-weight: 700; }
      .outcome-value span { color: var(--accent); font-size: clamp(38px, 4vw, 58px); font-weight: 780; letter-spacing: -0.06em; line-height: 1; }
      .outcome-line p { max-width: 32em; font-size: 15px; line-height: 1.5; }
      .contribution-area { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 13px; }
      .result-visual { min-height: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
      .result-visual img { width: 100%; height: 100%; object-fit: contain; }
      .result-canvas { height: 100%; min-height: 0; display: grid; align-content: center; gap: 16px; padding: clamp(18px, 2.5vw, 36px); }
      .deliverable-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .deliverable { min-height: 125px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
      .deliverable strong { font-size: clamp(20px, 2vw, 28px); }
      .deliverable p { margin-top: 6px; color: var(--muted); font-size: 15px; }
      .result-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .result-track { container-type: inline-size; padding: 18px; border-top: 3px solid var(--accent); background: var(--paper); }
      .result-track h3 { font-size: 19px; }
      .result-cluster { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 15px; }
      .result-track:first-child .result-cluster { grid-template-columns: minmax(0, 1.18fr) minmax(0, 0.91fr) minmax(0, 0.91fr); }
      .result-track:last-child .result-cluster { grid-template-columns: minmax(0, 0.86fr) minmax(0, 1.18fr) minmax(0, 0.96fr); }
      .result-cluster > div { min-width: 0; }
      .result-cluster strong { display: block; max-width: 100%; color: var(--accent); font-size: clamp(22px, 7cqi, 30px); font-variant-numeric: tabular-nums; letter-spacing: -0.035em; line-height: 1.06; white-space: nowrap; }
      .result-cluster span { display: block; color: var(--muted); font-size: 15px; line-height: 1.32; }
      .result-track > p { margin-top: 12px; color: var(--muted); font-size: 15px; line-height: 1.42; }
      .contribution-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
      .contribution-grid article { min-width: 0; padding: 11px 14px; border-left: 1px solid var(--line); }
      .contribution-grid article:first-child { border-left: 0; }
      .contribution-grid strong { color: var(--accent); font-size: 15px; }
      .contribution-grid p { margin-top: 4px; font-size: 15px; line-height: 1.43; }
      .result-footer { display: flex; align-items: center; justify-content: space-between; gap: 28px; padding-top: 12px; border-top: 1px solid var(--line-strong); }
      .result-footer strong { max-width: 38em; padding-left: 15px; border-left: 4px solid var(--accent); font-size: 17px; line-height: 1.48; }
      .result-footer span { max-width: 39em; color: var(--muted); font-size: 15px; line-height: 1.45; text-align: right; }

      .image-dialog {
        width: min(94vw, 1500px);
        max-width: none;
        max-height: 92dvh;
        padding: 0;
        color: var(--ink);
        border: 0;
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 30px 100px rgba(36, 33, 29, 0.32);
      }
      .image-dialog::backdrop { background: rgba(24, 22, 19, 0.82); backdrop-filter: blur(6px); }
      .dialog-bar { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 8px 12px 8px 20px; border-bottom: 1px solid var(--line); }
      .dialog-bar strong { font-size: 16px; }
      .dialog-actions { display: flex; align-items: center; gap: 8px; }
      .dialog-zoom, .dialog-close { min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 15px; font-weight: 700; white-space: nowrap; }
      .dialog-zoom[aria-pressed="true"] { color: var(--control-on); border-color: var(--control); background: var(--control); }
      .dialog-media { height: calc(92dvh - 60px); display: grid; place-items: center; padding: 18px; overflow: auto; }
      .dialog-media img { width: auto; max-width: 100%; height: auto; max-height: 100%; object-fit: contain; }
      .dialog-media[data-zoomed="true"] { place-items: start; }
      .dialog-media[data-zoomed="true"] img { max-width: none; max-height: none; }

      /* 真实项目素材：仅等比例缩放，不裁切、不拉伸 */
      .real-stage {
        position: absolute;
        z-index: 1;
        inset: 6% 4% 8% 7%;
        min-width: 0;
        min-height: 0;
        display: grid;
        place-items: center;
        padding: clamp(10px, 1.4vw, 18px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 26px 44px rgba(36, 33, 29, 0.16);
        overflow: hidden;
        transform: rotate(-1deg);
      }
      .real-stage.is-flat { transform: none; }
      .real-stage > .image-button,
      .real-panel-media > .image-button,
      .real-asset-card > .image-button { display: grid; place-items: center; min-width: 0; min-height: 0; overflow: hidden; }
      .real-stage img,
      .real-panel-media img,
      .real-asset-card img {
        width: auto;
        max-width: 100%;
        height: auto;
        max-height: 100%;
        object-fit: contain;
      }
      .phone-showcase {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        align-items: stretch;
        gap: clamp(7px, 1vw, 13px);
        padding: 4% 2% 5%;
      }
      .real-asset-grid {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        display: grid;
        gap: clamp(8px, 1vw, 13px);
      }
      .real-asset-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .real-asset-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .real-asset-grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
      .real-asset-card,
      .real-panel {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--surface);
        overflow: hidden;
      }
      .phone-showcase .real-asset-card { padding: 7px; background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: 0 14px 28px rgba(36, 33, 29, 0.12); }
      .real-panel-media { min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; }
      .real-panel-caption { color: var(--muted); font-size: 15px; font-weight: 700; line-height: 1.3; text-align: center; }
      .real-evidence-board { padding: clamp(9px, 1.2vw, 15px); }
      .real-solution-canvas { grid-template-rows: minmax(0, 1fr); align-content: stretch; padding: clamp(9px, 1.2vw, 15px); }
      .real-solution-canvas > .real-asset-grid,
      .real-solution-canvas > .real-panel { width: 100%; height: 100%; min-height: 0; align-self: stretch; }
      .real-result-visual { display: grid; grid-template-rows: minmax(0, 1fr); padding: clamp(8px, 1vw, 13px); }
      .real-result-visual > .real-panel-media,
      .real-result-visual > .real-asset-grid { width: 100%; height: 100%; min-height: 0; }
      .real-source-note { color: var(--muted); font-size: 15px; line-height: 1.4; }

      /* 阅读层级校正：保留母版字体系统，只放大二级屏与卡片信息 */
      .brand-link,
      .state-nav button,
      .header-status,
      .metric-item span,
      .breakpoint-stat span,
      .funnel-row span,
      .funnel-row strong,
      .voice-grid strong,
      .insight-row strong,
      .ecosystem-node span,
      .board-note,
      .research-product p,
      .mechanism-strip span,
      .signal-list span,
      .model-output p,
      .phase-number,
      .phase-caption p,
      .detail-item p,
      .locale-summary p,
      .locale-row strong,
      .locale-row span,
      .credit-controls button,
      .credit-node span,
      .state-explanation,
      .exception-item p,
      .sms-level > p,
      .sms-action span,
      .outcome-line h3,
      .deliverable p,
      .result-cluster span,
      .result-track > p,
      .contribution-grid strong,
      .contribution-grid p,
      .result-footer span,
      .dialog-zoom,
      .dialog-close,
      .real-panel-caption,
      .real-source-note { font-size: 16px; }
      .screen-title { font-size: clamp(40px, 3.6vw, 56px); }
      .section-copy { font-size: 17px; line-height: 1.62; }
      .screen-kicker { font-size: 16px; }
      .voice-grid p,
      .insight-row p,
      .outcome-line p { font-size: 17px; line-height: 1.55; }
      .judgment-box h3 { font-size: 21px; }
      .judgment-flow strong { font-size: 17px; }
      .phase-map strong { font-size: 19px; }
      .detail-item strong { font-size: 17px; }
      .phase-caption strong,
      .text-detail strong { font-size: 18px; }
      .detail-column h3 { font-size: 20px; }
      .result-track h3 { font-size: 20px; }
      .research-figure figcaption,
      .evidence-caption { font-size: 16px; }

      /* 同组竖向产品截图按共享舞台高度等比例展示，不裁切、不变形 */
      .media-portrait .image-button img,
      body[data-project="kwai"] .phone-showcase .image-button img,
      body[data-project="credits"] .real-asset-grid.two .image-button img,
      body[data-project="credits"] .real-asset-grid.three .image-button img,
      body[data-project="credits"] .real-asset-grid.four .image-button img {
        width: auto;
        max-width: 100%;
        height: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      @media (max-width: 820px) {
        .real-stage { inset: 4% 2% 6% 3%; padding: 7px; border-radius: 13px; }
        .phone-showcase { gap: 4px; padding: 2% 0 3%; }
        .phone-showcase .real-asset-card { padding: 4px; gap: 3px; border-radius: 9px; }
        .real-asset-card, .real-panel { padding: 5px; gap: 3px; border-radius: 10px; }
        .real-panel-caption { font-size: 15px; line-height: 1.3; }
        .real-asset-grid { gap: 5px; }
        .real-evidence-board, .real-solution-canvas, .real-result-visual { padding: 5px; }
      }

      @media (max-width: 480px) {
        .phone-showcase .real-asset-card:nth-child(2),
        .phone-showcase .real-asset-card:nth-child(4) { display: none; }
        .phone-showcase { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .phone-showcase .real-panel-caption { display: none; }
        .real-asset-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .real-asset-grid.four .real-panel-caption { display: none; }
      }

      @media (max-width: 1120px) {
        :root { --gutter: clamp(20px, 3.4vw, 40px); }
        .case-header { grid-template-columns: minmax(90px, 1fr) auto minmax(90px, 1fr); }
        .brand-link span:last-child, .header-hint { display: none; }
        .overview-main { grid-template-columns: minmax(280px, 0.74fr) minmax(440px, 1.26fr); gap: 28px; }
        .device-stage img:first-child { left: 13%; }
        .device-stage img:last-child { right: 7%; }
        .evidence-layout { grid-template-columns: minmax(330px, 0.72fr) minmax(440px, 1.28fr); gap-inline: 28px; }
        .solution-workbench { grid-template-columns: minmax(520px, 1.42fr) minmax(270px, 0.58fr); gap: 20px; }
        .phase-map { grid-template-columns: repeat(2, minmax(170px, 1fr)); }
        .result-main { grid-template-columns: minmax(320px, 0.75fr) minmax(470px, 1.25fr); gap: 38px; }
        .system-flow { gap: 6px; }
        .system-node { min-height: 135px; padding-inline: 8px; }
      }

      @media (max-width: 820px) {
        :root { --header-h: 112px; --gutter: 14px; }
        .case-header {
          grid-template-columns: 1fr auto;
          grid-template-rows: 50px 56px;
          grid-template-areas: "brand status" "nav nav";
          gap: 0 10px;
          padding: 4px var(--gutter) 0;
        }
        .brand-link { grid-area: brand; }
        .brand-mark { width: 38px; height: 38px; }
        .header-status { grid-area: status; }
        .state-nav { grid-area: nav; width: 100%; justify-content: space-between; gap: 2px; }
        .state-nav button { flex: 1; min-width: 0; padding-inline: 5px; letter-spacing: -0.025em; }
        .case-screen { padding-top: calc(var(--header-h) + 12px); padding-bottom: 12px; }
        .screen-title { font-size: clamp(32px, 9vw, 38px); line-height: 1.08; }
        .section-copy { font-size: 16px; line-height: 1.45; }

        .overview-layout { gap: 9px; }
        .overview-main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); align-items: start; gap: 7px; }
        .hero-copy { max-width: none; }
        .hero-copy h1 { max-width: none; margin-top: 5px; font-size: clamp(36px, 10vw, 44px); }
        .hero-thesis { max-width: none; margin-top: 8px; font-size: 16px; line-height: 1.45; }
        .hero-decision { max-width: none; margin-top: 9px; padding-left: 10px; font-size: 16px; line-height: 1.4; }
        .device-stage, .hero-stage { width: 100%; height: 100%; min-height: 245px; }
        .device-stage::before, .hero-stage::before { top: 10%; right: 4%; width: 88%; }
        .device-stage::after, .hero-stage::after { right: 3%; left: 3%; }
        .device-stage img { height: 91%; border-radius: 16px; }
        .device-stage img:first-child { left: 10%; }
        .device-stage img:last-child { right: 7%; height: 84%; }
        .map-paper, .system-hero-canvas, .crm-hero-canvas { inset: 7% 3% 10% 5%; padding: 10px; border-radius: 14px; }
        .system-flow { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); overflow: visible; gap: 5px; }
        .system-node { min-height: 76px; padding: 7px 5px; }
        .system-node:nth-child(-n + 3) { grid-column: span 2; }
        .system-node:nth-child(4) { grid-column: 2 / span 2; }
        .system-node:nth-child(5) { grid-column: 4 / span 2; }
        .system-node strong, .system-node span { font-size: 15px; line-height: 1.2; }
        .system-caption { line-height: 1.25; }
        .crm-hero-canvas { gap: 5px; }
        .crm-lane { grid-template-columns: 72px minmax(0, 1fr) 82px; gap: 6px; padding: 8px 4px; }
        .crm-lane > strong { font-size: 15px; }
        .crm-path { gap: 3px; font-size: 15px; line-height: 1.15; }
        .crm-result b { font-size: 24px; }
        .crm-result span { line-height: 1.15; }
        .overview-metrics { grid-template-columns: 1.3fr 0.85fr 0.75fr; }
        .metric-item { min-height: 88px; gap: 5px; padding: 9px 8px; }
        .metric-item strong { font-size: clamp(20px, 5.7vw, 25px); }

        .evidence-layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(190px, 1fr) auto; grid-template-areas: "head" "map" "insights"; gap: 9px; }
        .evidence-head .section-copy { margin-top: 5px; }
        .research-figure, .evidence-visual { gap: 4px; }
        .research-figure figcaption, .evidence-caption { line-height: 1.32; }
        .evidence-insights { grid-template-columns: 1fr; grid-template-rows: auto; align-content: stretch; gap: 7px; }
        .diagnosis-stack, .evidence-stat-stack { grid-row: auto; grid-template-columns: minmax(118px, 0.72fr) minmax(0, 1.28fr); align-items: start; gap: 10px; }
        .breakpoint-stat { display: block; padding-top: 6px; }
        .breakpoint-stat span { display: block; }
        .breakpoint-stat strong { display: block; margin-top: 3px; font-size: 34px; }
        .funnel { gap: 5px; }
        .funnel-row { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; }
        .funnel-row > span { grid-column: 1; grid-row: 1; }
        .funnel-row > strong { grid-column: 2; grid-row: 1; }
        .funnel-track { grid-column: 1 / -1; grid-row: 2; height: 6px; }
        .voice-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .voice-grid blockquote { padding-top: 5px; }
        .voice-grid p, .insight-row p { margin-top: 1px; font-size: 16px; line-height: 1.38; }
        .insight-list { gap: 3px; }
        .insight-row { padding-top: 4px; }
        .judgment-box { padding: 7px 0 0 9px; border-left-width: 3px; }
        .judgment-box h3 { font-size: 18px; line-height: 1.32; }
        .judgment-flow { gap: 5px; margin-top: 5px; }
        .judgment-flow small { display: none; }
        .judgment-flow strong { margin-top: 0; font-size: 16px; line-height: 1.3; }
        .ecosystem-board { gap: 7px; padding: 8px; }
        .ecosystem-path { gap: 5px; }
        .ecosystem-node { min-height: 90px; padding: 7px 5px; }
        .ecosystem-node strong, .ecosystem-node span { font-size: 15px; line-height: 1.18; }
        .board-note { line-height: 1.25; }
        .research-products { gap: 6px; padding: 8px; }
        .research-product { min-height: 80px; padding: 9px; }
        .research-product strong, .research-product p { font-size: 15px; line-height: 1.2; }
        .mechanism-strip span { padding: 6px 3px; line-height: 1.15; }
        .model-board { grid-template-columns: 1fr auto 1.2fr auto 1fr; gap: 5px; padding: 8px; }
        .model-group, .model-output { gap: 5px; padding: 8px; }
        .model-group h3, .model-output h3, .model-output p { font-size: 15px; line-height: 1.2; }
        .signal-list { gap: 3px; }
        .signal-list span { padding: 3px 5px; font-size: 15px; }
        .model-operator { font-size: 20px; }

        .solution-layout { gap: 8px; }
        .solution-head { grid-template-columns: 1fr; gap: 7px; }
        .solution-head .section-copy { margin-top: 4px; }
        .phase-map { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
        .phase-map button { min-height: 68px; padding: 8px 9px; gap: 1px 7px; }
        .phase-map strong { font-size: 16px; }
        .solution-workbench { grid-template-columns: 1fr; grid-template-rows: minmax(0, 0.6fr) minmax(0, 0.4fr); gap: 7px; }
        .phase-board { padding: 7px; border-radius: 14px; }
        .phase-caption { grid-template-columns: 0.72fr 1.28fr; gap: 8px; padding-top: 6px; }
        .phase-caption strong, .phase-caption p { font-size: 16px; line-height: 1.38; }
        .detail-column { gap: 4px; overflow: hidden; }
        .detail-column h3 { font-size: 17px; }
        .detail-grid { gap: 12px; overflow: hidden; }
        .detail-item { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 4px; padding-top: 5px; overflow: hidden; }
        .detail-visual { grid-row: 1; min-height: 0; }
        .detail-visual .image-button { position: relative; min-height: 0; overflow: hidden; }
        .detail-visual img { position: absolute; inset: 0; width: 100%; max-width: none; height: 100%; max-height: none; object-fit: contain; }
        .detail-item strong { white-space: nowrap; }
        .detail-item p { display: none; }
        .text-detail { display: block; padding: 7px 0; }
        .text-detail strong { font-size: 17px; white-space: normal; }
        .text-detail p { display: block; margin-top: 4px; font-size: 16px; line-height: 1.34; }
        .solution-canvas { gap: 6px; padding: 8px; }
        .solution-canvas .ecosystem-node { min-height: 78px; }
        .locale-summary { grid-template-columns: 0.5fr 1.5fr; gap: 8px; padding-bottom: 6px; }
        .locale-summary strong { font-size: 34px; }
        .locale-summary p { line-height: 1.22; }
        .locale-matrix { gap: 0 8px; }
        .locale-row { padding: 5px 0; gap: 5px; }
        .locale-row strong, .locale-row span { line-height: 1.15; }
        .credit-controls { gap: 3px; }
        .credit-controls button { min-height: 36px; padding: 5px 7px; }
        .credit-machine { gap: 4px; }
        .credit-node { min-height: 78px; padding: 5px; }
        .credit-node strong, .credit-node span { font-size: 15px; line-height: 1.15; }
        .state-explanation { padding-left: 8px; line-height: 1.22; }
        .exception-grid, .sms-board { gap: 6px; }
        .exception-item { min-height: 90px; padding: 8px; }
        .exception-item strong, .exception-item p { font-size: 15px; line-height: 1.18; }
        .sms-level { min-height: 125px; gap: 5px; padding: 8px; }
        .sms-level h3, .sms-level > p, .sms-action strong, .sms-action span { font-size: 15px; line-height: 1.18; }
        .sms-action { padding-top: 5px; }

        .result-layout { gap: 8px; }
        .result-head { grid-template-columns: 1fr; gap: 4px; }
        .result-main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 7px; }
        .outcome-list { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 1fr; }
        .outcome-line { align-content: start; gap: 4px; padding: 7px 8px 7px 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
        .outcome-line:last-child { padding-right: 0; padding-left: 8px; border-right: 0; }
        .outcome-value { gap: 5px; }
        .outcome-value span { font-size: 29px; }
        .outcome-line p { font-size: 16px; line-height: 1.38; }
        .contribution-area { gap: 6px; }
        .result-visual { border-radius: 14px; }
        .result-canvas { gap: 7px; padding: 8px; }
        .deliverable-grid { gap: 6px; }
        .deliverable { min-height: 68px; padding: 8px; }
        .deliverable strong, .deliverable p { font-size: 15px; line-height: 1.18; }
        .result-pair { gap: 6px; }
        .result-track { padding: 8px; }
        .result-track h3, .result-track > p { font-size: 15px; line-height: 1.18; }
        .result-cluster { gap: 4px; margin-top: 6px; }
        .result-cluster strong { font-size: 15px; }
        .result-cluster > div + div { padding-left: 4px; border-left: 1px solid var(--line); }
        .result-cluster span { line-height: 1.15; }
        .contribution-grid article { padding: 6px 7px; }
        .contribution-grid p { font-size: 16px; line-height: 1.34; }
        .result-footer { align-items: flex-start; gap: 9px; padding-top: 6px; }
        .result-footer strong { padding-left: 9px; font-size: 16px; line-height: 1.38; }
        .result-footer span { display: none; }
      }

      @media (max-width: 480px) {
        .state-nav button { font-size: 15px; }
        .overview-metrics { grid-template-columns: 1.25fr 0.85fr 0.8fr; }
        .metric-item strong { font-size: 20px; }
        .evidence-layout { grid-template-rows: auto minmax(180px, 1fr) auto; }
        .research-figure figcaption span:first-child, .evidence-caption { display: none; }
        .phase-map small { white-space: nowrap; }
        .contribution-grid p { letter-spacing: -0.018em; }
        .dialog-bar { gap: 10px; padding-left: 14px; }
        .dialog-bar strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dialog-zoom, .dialog-close { padding-inline: 11px; }
      }

      @media (max-width: 820px) and (max-height: 700px) {
        :root { --header-h: 94px; }
        .case-header { grid-template-rows: 42px 46px; height: var(--header-h); padding-top: 2px; }
        .brand-mark { width: 34px; height: 34px; }
        .state-nav button { min-height: 40px; padding-block: 6px; }
        .case-screen { padding-top: calc(var(--header-h) + 7px); padding-bottom: 7px; }
        .screen-title { font-size: 30px; }
        .overview-layout { gap: 5px; }
        .overview-main { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); grid-template-rows: minmax(0, 1fr); align-items: center; gap: 8px; }
        .hero-copy h1 { font-size: 36px; }
        .hero-thesis { margin-top: 5px; line-height: 1.34; }
        .hero-decision { margin-top: 6px; line-height: 1.3; }
        .device-stage, .hero-stage { min-height: 0; }
        .device-stage img { height: 86%; }
        .overview-metrics, .metric-item { min-height: 78px; }
        .evidence-layout { grid-template-rows: auto minmax(190px, 0.9fr) auto; gap: 5px; }
        .research-figure figcaption, .evidence-caption { display: none; }
        .evidence-head .section-copy { line-height: 1.34; }
        .evidence-insights { gap: 3px 8px; }
        .breakpoint-stat strong { font-size: 29px; }
        .solution-layout { gap: 5px; }
        .solution-head { grid-template-columns: 1fr; align-items: start; gap: 4px; }
        .solution-head .section-copy { line-height: 1.32; }
        .phase-map button { min-height: 54px; }
        .phase-map small { display: none; }
        .solution-workbench { grid-template-rows: minmax(0, 0.68fr) minmax(0, 0.32fr); gap: 4px; }
        .phase-caption { padding-top: 3px; }
        .detail-column h3 { display: none; }
        .detail-item { display: block; position: relative; height: 100%; padding: 3px 0 22px; overflow: hidden; }
        .detail-visual { position: absolute; inset: 3px 0 22px; }
        .detail-item > strong { position: absolute; right: 0; bottom: 0; left: 0; line-height: 1.2; }
        .text-detail { position: static; padding: 4px 0; }
        .text-detail > strong { position: static; }
        .text-detail p { display: none; }
        .result-layout { gap: 5px; }
        .result-head .section-copy { line-height: 1.32; }
        .result-main { gap: 4px; }
        .outcome-line { padding-block: 4px; }
        .outcome-value span { font-size: 25px; }
        .outcome-line p { line-height: 1.22; }
        .contribution-area { gap: 4px; }
        .contribution-grid p { line-height: 1.18; }
        .result-footer { padding-top: 4px; }
      }

      @media (min-width: 821px) and (max-height: 770px) {
        :root { --header-h: 68px; }
        .case-screen { padding-top: calc(var(--header-h) + 15px); padding-bottom: 15px; }
        .screen-title { font-size: 42px; }
        .hero-copy h1 { font-size: 50px; }
        .hero-thesis { margin-top: 13px; font-size: 16px; }
        .hero-decision { margin-top: 13px; }
        .metric-item { min-height: 90px; padding-block: 12px; }
        .metric-item strong { font-size: 27px; }
        .breakpoint-stat strong { font-size: 43px; }
        .evidence-layout {
          grid-template-columns: minmax(360px, 0.84fr) minmax(420px, 1.16fr);
          gap: 11px 28px;
        }
        .evidence-head .section-copy { line-height: 1.48; }
        .evidence-insights { gap: 8px; }
        .diagnosis-stack, .evidence-stat-stack { gap: 8px; }
        .insight-list { gap: 5px; }
        .insight-row { padding-top: 5px; }
        .voice-grid p, .insight-row p { line-height: 1.4; }
        .judgment-box { padding-top: 9px; }
        .judgment-flow { margin-top: 6px; }
        .solution-layout, .result-layout { gap-block: 11px; }
        .phase-map button { min-height: 64px; padding-block: 8px; }
        .phase-caption { padding-top: 8px; }
        .contribution-grid article { padding-block: 8px; }
        .result-footer { padding-top: 8px; }
      }

      .map-paper > .image-button,
      .research-frame > .image-button,
      .phase-frame > .image-button,
      .detail-visual > .image-button,
      .result-visual > .image-button,
      .real-stage > .image-button,
      .real-evidence-board > .image-button,
      .real-panel-media > .image-button,
      .real-asset-card > .image-button {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .map-paper > .image-button > img,
      .research-frame > .image-button > img,
      .phase-frame > .image-button > img,
      .detail-visual > .image-button > img,
      .result-visual > .image-button > img,
      .real-stage > .image-button > img,
      .real-evidence-board > .image-button > img,
      .real-panel-media > .image-button > img,
      .real-asset-card > .image-button > img {
        position: absolute;
        inset: 0;
        margin: auto;
        width: auto;
        max-width: 100%;
        height: auto;
        max-height: 100%;
        object-fit: contain;
      }
      .device-stage img { width: auto; max-width: 100%; max-height: 100%; object-fit: contain; }
      .dialog-media { position: relative; }
      .dialog-media[data-zoomed="false"] img {
        position: absolute;
        inset: 18px;
        margin: auto;
        width: auto;
        max-width: calc(100% - 36px);
        height: auto;
        max-height: calc(100% - 36px);
        object-fit: contain;
      }
      .dialog-media[data-zoomed="true"] img { position: static; inset: auto; margin: 0; width: auto; height: auto; max-width: none; max-height: none; object-fit: contain; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#overview">跳至项目内容</a>
    <header class="case-header" aria-label="项目导航">
      <a class="brand-link" href="../index.html" aria-label="返回作品集主页">
        <span class="brand-mark">Q×H</span>
        <span>返回作品集</span>
      </a>
      <nav class="state-nav" role="tablist" aria-label="项目四个状态">
        <button id="tab-overview" type="button" role="tab" aria-controls="overview" aria-selected="true" tabindex="0" data-state-target="overview">概览</button>
        <button id="tab-evidence" type="button" role="tab" aria-controls="evidence" aria-selected="false" tabindex="-1" data-state-target="evidence">证据与判断</button>
        <button id="tab-solution" type="button" role="tab" aria-controls="solution" aria-selected="false" tabindex="-1" data-state-target="solution">方案</button>
        <button id="tab-result" type="button" role="tab" aria-controls="result" aria-selected="false" tabindex="-1" data-state-target="result">结果与贡献</button>
      </nav>
      <div class="header-status">
        <span class="header-hint">滚轮 / 方向键切换</span>
        <span class="state-count"><span data-current-count>01</span> / 04</span>
      </div>
      <div class="header-progress" aria-hidden="true"><span></span></div>
    </header>

    <main class="project-viewport" id="project-content" tabindex="-1">
      <div data-project-root></div>
    </main>

    <dialog class="image-dialog" data-image-dialog>
      <div class="dialog-bar">
        <strong data-dialog-title>项目图片</strong>
        <div class="dialog-actions">
          <button class="dialog-zoom" type="button" aria-pressed="false" data-dialog-zoom>原始尺寸</button>
          <button class="dialog-close" type="button" data-dialog-close>关闭</button>
        </div>
      </div>
      <div class="dialog-media" data-dialog-media data-zoomed="false"><img src="assets/cloud/phase-1-core.jpg" alt="项目图片" data-dialog-image /></div>
    </dialog>

          if (backward.includes(event.key)) { event.preventDefault(); setActive(activeIndex - 1); }
          if (event.key === "Home") { event.preventDefault(); setActive(0); }
          if (event.key === "End") { event.preventDefault(); setActive(states.length - 1); }
        });

        const finishSwipe = (startX, startY, endX, endY) => {
          const dx = endX - startX;
          const dy = endY - startY;
          if (Math.max(Math.abs(dx), Math.abs(dy)) < 46) return;
          const dominant = Math.abs(dy) >= Math.abs(dx) ? dy : dx;
          setActive(activeIndex + (dominant < 0 ? 1 : -1));
        };

        window.addEventListener("touchstart", (event) => {
          const touch = event.changedTouches[0];
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
          touchStartedOnControl = event.target instanceof Element && Boolean(event.target.closest("button, a"));
        }, { passive: true });
        window.addEventListener("touchend", (event) => {
          if (dialog?.open || touchStartedOnControl) return;
          const touch = event.changedTouches[0];
          finishSwipe(touchStartX, touchStartY, touch.clientX, touch.clientY);
        }, { passive: true });
        window.addEventListener("pointerdown", (event) => {
          if (event.pointerType !== "mouse" || innerWidth > 820) return;
          pointerStartX = event.clientX;
          pointerStartY = event.clientY;
          pointerStartedOnControl = event.target instanceof Element && Boolean(event.target.closest("button, a"));
        }, { passive: true });
        window.addEventListener("pointerup", (event) => {
          if (event.pointerType !== "mouse" || innerWidth > 820 || dialog?.open || pointerStartedOnControl) return;
          finishSwipe(pointerStartX, pointerStartY, event.clientX, event.clientY);
        }, { passive: true });

        const setDialogZoom = (zoomed) => {
          if (!dialogMedia || !dialogZoom) return;
          dialogMedia.dataset.zoomed = String(zoomed);
          dialogZoom.setAttribute("aria-pressed", String(zoomed));
          dialogZoom.textContent = zoomed ? "适合窗口" : "原始尺寸";
          if (!zoomed) { dialogMedia.scrollLeft = 0; dialogMedia.scrollTop = 0; }
        };
        const openDialog = (src, title, alt) => {
          if (!(dialog instanceof HTMLDialogElement) || !(dialogImage instanceof HTMLImageElement)) return;
          setDialogZoom(false);
          dialogImage.src = src;
          dialogImage.alt = alt || title;
          if (dialogTitle) dialogTitle.textContent = title || "项目图片";
          dialog.showModal();
        };
        document.addEventListener("click", (event) => {
          const button = event.target.closest("[data-lightbox]");
          if (!button) return;
          const sourceImage = button.querySelector("img");
          openDialog(button.dataset.lightbox || sourceImage?.currentSrc || sourceImage?.src, button.dataset.lightboxTitle, sourceImage?.alt);
        });
        dialogZoom?.addEventListener("click", () => setDialogZoom(dialogZoom.getAttribute("aria-pressed") !== "true"));
        document.querySelector("[data-dialog-close]")?.addEventListener("click", () => dialog?.close());
        dialog?.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); });
        dialog?.addEventListener("close", () => setDialogZoom(false));
        window.addEventListener("hashchange", () => {
          const nextRoute = readRoute();
          if (nextRoute.project !== projectKey) {
            projectKey = nextRoute.project;
            activeIndex = 0;
            deckTimeline?.kill();
            revealTimeline?.kill();
            funnelTimeline?.kill();
            modeTimeline?.kill();
            if (dialog?.open) dialog.close();
            renderProject();
            return;
          }
          const index = states.indexOf(nextRoute.state);
          if (index >= 0) setActive(index, false);
        });

        renderProject();
      })();
    </script>
  </body>
</html>
